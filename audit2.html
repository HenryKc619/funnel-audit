      function setLogo(idx) {

        document.getElementById("logoSVG").innerHTML =
          `<rect width="48" height="48" rx="14" fill="${icon.color}"/>${icon.paths}`;

      /* ── Progress ── */
      function updateProgress(answered) {
        const pct = Math.round((answered / TOTAL) * 100);
        document.getElementById("progressFill").style.width = pct + "%";
        document.getElementById("progressCount").innerText =
          `${answered} of ${TOTAL}`;
        let status;
        if (answered === 0) status = "Let's get started!";
        else if (answered < 4) status = `${answered} answered, keep going`;
        else if (answered < 8)
          status = `${answered} of ${TOTAL} — halfway there`;
        else if (answered < TOTAL)
          status = `${TOTAL - answered} question${TOTAL - answered > 1 ? "s" : ""} left, almost done`;
        else status = "All answered, see your results";
        document.getElementById("progressStatus").innerText = status;
      }

      /* ── Highlight selected answer button ── */
      function highlightSelected(choice) {
        const map = { yes: "btnYes", no: "btnNo", "not sure": "btnNotSure" };
        ["btnYes", "btnNo", "btnNotSure"].forEach((id) => {
          const btn = document.getElementById(id);
          btn.style.opacity = "1";
          btn.style.outline = "none";
          btn.style.boxShadow = "none";
        });
        if (choice && map[choice]) {
          ["btnYes", "btnNo", "btnNotSure"].forEach((id) => {
            if (id !== map[choice])
              document.getElementById(id).style.opacity = "0.4";
          });
          const sel = document.getElementById(map[choice]);
          sel.style.outline = "3px solid white";
          sel.style.boxShadow = "0 0 0 4px rgba(255,255,255,0.3)";
        }
      }

      /* ── Refresh nav button state ── */
      function refreshNavButtons() {
        document.getElementById("navButtons").style.display = "flex";
        // Back: show from question 2 onward
        document.getElementById("backBtn").style.display =
          currentIndex > 0 ? "inline-block" : "none";
        // Next: active only after answer chosen
        const nextBtn = document.getElementById("nextBtn");
        if (currentAnswer) {
          nextBtn.classList.add("active");
        } else {
          nextBtn.classList.remove("active");
        }
        nextBtn.innerText =
          currentIndex === TOTAL - 1 ? "See My Results →" : "Next →";
      }

      /* ── Show Question ── */
      function showQuestion() {
        currentAnswer =
          answers[currentIndex] !== undefined ? answers[currentIndex] : null;
        document.getElementById("question").innerText =
          questions[currentIndex].q;
        setLogo(currentIndex + 1);
        updateProgress(currentIndex);

        if (currentIndex === 0) {
          document.getElementById("progressWrapper").style.display = "block";
        }

        // Restore highlight & feedback if revisiting
        highlightSelected(currentAnswer);
        const fb = document.getElementById("inlineFeedback");
        if (currentAnswer) {
          fb.innerText = questions[currentIndex].feedback[currentAnswer];
          fb.style.display = "block";
        } else {
          fb.style.display = "none";
        }

        refreshNavButtons();
      }

      /* ── Select Answer (does NOT advance) ── */
      function selectAnswer(choice) {
        currentAnswer = choice;
        const fb = document.getElementById("inlineFeedback");
        fb.innerText = questions[currentIndex].feedback[choice];
        fb.style.display = "block";
        highlightSelected(choice);
        refreshNavButtons();
      }

      /* ── Commit answer and rebuild weakSuggestions for this slot ── */
      function commitAnswer(index, choice) {
        const suggestion = questions[index].suggestion;
        // Remove old suggestion for this index if it was previously weak
        const oldChoice = answers[index];
        if (oldChoice !== undefined && oldChoice !== "yes") {
          const i = weakSuggestions.indexOf(suggestion);
          if (i !== -1) weakSuggestions.splice(i, 1);
        }
        // Add suggestion if new answer is weak
        if (choice !== "yes") {
          weakSuggestions.push(suggestion);
        }
        answers[index] = choice;
      }

      /* ── Next ── */
      function goNext() {
        if (!currentAnswer) return;
        commitAnswer(currentIndex, currentAnswer);
        currentIndex++;
        updateProgress(currentIndex);
        if (currentIndex < TOTAL) {
          showQuestion();
        } else {
          showLeadForm();
        }
      }

      /* ── Back ── */
      function goBack() {
        if (currentIndex === 0) return;
        // Save current selection if any before going back
        if (currentAnswer !== null) {
          commitAnswer(currentIndex, currentAnswer);
        }
        currentIndex--;
        updateProgress(currentIndex);
        showQuestion();
      }

      /* ── Lead Form ── */
      function showLeadForm() {
        document.getElementById("optionsDiv").style.display = "none";
        document.getElementById("pickOneDiv").style.display = "none";
        document.getElementById("navButtons").style.display = "none";
        document.getElementById("inlineFeedback").style.display = "none";
        document.getElementById("submit-container").style.display = "flex";

        setLogo(12);
        document.getElementById("progressFill").style.width = "100%";
        document.getElementById("progressStatus").innerText =
          "Almost done. Get your personalized audit";
        document.getElementById("progressCount").innerText =
          `${TOTAL} of ${TOTAL}`;

        const allYes = weakSuggestions.length === 0;

        if (allYes) {
          document.getElementById("question").innerText =
            "🔥 Your funnel looks strong on paper but is it actually getting more people to buy";
          document.getElementById("result").innerHTML = `
            <div class='quick-suggestions'>
              <strong>💡 Here's the truth:</strong>
              <p style="margin:10px 0 6px;">Most coaches who answer YES to everything are still leaving money on the table — they just can't see where.</p>
              <p style="margin:0 0 6px;">The real question isn't whether your funnel <em>looks</em> right. It's whether it's actually turning visitors into paying clients.</p>
              <p style="margin:0;"><strong>Enter your details below and we'll do a free personal review of your actual page</strong> and show you exactly where you could be getting more bookings.</p>
            </div>`;
          document.getElementById("submitBtn").innerHTML =
            'Get My Free Personal Review <i class="fas fa-arrow-right"></i>';
        } else {
          document.getElementById("question").innerText =
            "Here's what we found, Enter your details to get your full personalized fix.";
          let html =
            "<div class='quick-suggestions'><strong>🔍 Here's What To Do:</strong><ul>";
          weakSuggestions.forEach((s) => (html += `<li>⚠️ ${s}</li>`));
          html += `</ul><p style="margin:10px 0 0;font-size:13px;color:#555;">
            Fill in your details below and we'll send you a <strong>simple step-by-step plan</strong> to fix each of these for free
          </p></div>`;
          document.getElementById("result").innerHTML = html;
        }
      }

      /* ── Validation ── */
      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      function showFieldError(id, message) {
        const field = document.getElementById(id);
        let err = field.parentNode.querySelector(".field-error");
        if (!err) {
          err = document.createElement("small");
          err.className = "field-error";
          field.parentNode.appendChild(err);
        }
        err.innerText = message;
        field.style.borderColor = "red";
      }

      function clearFieldError(id) {
        const field = document.getElementById(id);
        const err = field.parentNode.querySelector(".field-error");
        if (err) err.innerText = "";
        field.style.borderColor = "#ccc";
      }

      /* ── Submit ── */
      async function submitQuiz() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const funnel = document.getElementById("funnel").value.trim();

        ["name", "email", "funnel"].forEach(clearFieldError);
        let hasError = false;

        if (!name) {
          showFieldError("name", "Please enter your name.");
          hasError = true;
        }
        if (!email) {
          showFieldError("email", "Please enter your email.");
          hasError = true;
        } else if (!isValidEmail(email)) {
          showFieldError(
            "email",
            "Invalid email — please use format: you@example.com",
          );
          hasError = true;
        }
        if (!funnel) {
          showFieldError("funnel", "Please enter your website or funnel link.");
          hasError = true;
        }
        if (hasError) return;

        let funnelURL = funnel;
        if (!/^https?:\/\//i.test(funnelURL))
          funnelURL = "https://" + funnelURL;

        document.getElementById("progressStatus").innerText =
          "Sending your audit…";

        const allYes = weakSuggestions.length === 0;
        const payload = {
          fields: {
            Name: name,
            "Email Address": email,
            "Funnel Link": funnelURL,
            Answers: JSON.stringify(answers),
            "Weak Suggestions": allYes
              ? "ALL YES — Send Personal Review"
              : weakSuggestions.join("; "),
          },
        };

        try {
          const res = await fetch(
            `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}`,
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${AIRTABLE_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            },
          );
          if (!res.ok) throw new Error("Airtable error");
          showFinalResult(name);
        } catch (err) {
          console.error(err);
          alert("Submission failed. Please try again.");
          document.getElementById("progressStatus").innerText =
            "Almost done, get your personalized audit";
        }
      }

      /* ── Final Result ── */
      function showFinalResult(name) {
        setLogo(13);
        document.getElementById("progressWrapper").style.display = "none";
        document.getElementById("question").style.display = "none";
        document.getElementById("submit-container").style.display = "none";

        const allYes = weakSuggestions.length === 0;
        document.getElementById("result").innerHTML = allYes
          ? `
          <div style="text-align:center;padding:10px 0;">
            <h3>Got it, ${name}</h3>
            <p>We're going to take a personal look at your funnel and find the hidden gaps.</p>
            <p>Check your inbox, I'll be in touch soon with a real, honest review and exactly where you could be converting more.</p>
          </div>`
          : `
          <div style="text-align:center;padding:10px 0;">
            <h3>You're all set, ${name}</h3>
            <p>We're putting together your personal plan right now.</p>
            <p>Check your inbox soon, it will show you exactly what to fix and how to get more people to say yes.</p>
            
        <p class="ty-sub">
          Your audit answers have been received.<br />
          Here's exactly what happens next so you know what to expect.
        </p>

                <!-- What happens next -->
        <div class="next-steps">
          <h3>What Happens Next</h3>

          <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">
              <strong>Check your inbox :</strong> you'll get a confirmation
              email shortly. If you don't see it, check your spam folder and
              mark it as safe.
            </div>
          </div>

          <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">
              <strong>I personally reviews your answers :</strong> this usually
              takes 1 to 2 business days. It's not automated. A real person
              looks at your page.
            </div>
          </div>

          <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">
              <strong>You get your fix plan :</strong> a clear, simple breakdown
              of what's not working and the exact steps to fix it. No fluff.
            </div>
          </div>
        </div>

        <!-- Tip -->
        <div class="ty-tip">
          <i class="fas fa-lightbulb"></i>
          <strong>Tip:</strong> While you wait, think about the last 5 people
          who visited your page. Did any of them reach out? If not, that gap is
          exactly what this audit will help you close.
        </div>

        <!-- Social nudge -->
        <div class="social-nudge">
          <p>
            Want more free tips on getting clients from your page? Follow along:
          </p>
          <div class="social-links">
            <a
              href="https://www.facebook.com/share/1RUDqwE2Ev/?mibextid=wwXIfr"
              class="fb"
              target="_blank"
            >
              <i class="fab fa-facebook-f"></i> Facebook
            </a>
          </div>
        </div>

        <!-- Back link -->
        <a href="index.html" class="ty-back">
          <i class="fas fa-arrow-left"></i> Back to home
        </a>

          </div>`;
      }

      /* ── Init ── */
      setLogo(0);
      showQuestion();
    </script>
